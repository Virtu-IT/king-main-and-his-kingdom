<header>
  <h1><span aria-hidden="true">👑</span> <span class="brand">King Main &amp; his Kingdom</span></h1>
  <nav>
    @if (auth.loggedIn()) {
      <a routerLink="/persons" routerLinkActive="active">Persons</a>
      <a routerLink="/arsenal" routerLinkActive="active">Arsenal</a>
    }
    <a routerLink="/security-lab" routerLinkActive="active">Security lab</a>
  </nav>
  <div class="who">
    @if (auth.loggedIn()) {
      <span class="user">{{ auth.username() }}</span>
      @for (role of auth.roles(); track role) {
        <span class="tag">{{ role }}</span>
      }
      <button type="button" class="secondary small" (click)="auth.logout()">Log out</button>
    } @else {
      <a class="btn small" routerLink="/login">Log in</a>
    }
    <button type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'">
      {{ dark() ? '☀️' : '🌙' }}
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>
